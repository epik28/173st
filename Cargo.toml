[workspace]
members = ["crates/beta-core", "crates/beta-view", "crates/beta-viewer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/epik28/173st"

[workspace.dependencies]
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = "=0.34.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pollster = "=0.4.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
winit = "=0.30.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
