[workspace]
members = ["crates/beta-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/epik28/173st"

[workspace.dependencies]
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
